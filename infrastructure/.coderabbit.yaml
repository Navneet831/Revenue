# CodeRabbit Configuration (Executive Standard)
# Enforces strict architectural and security patterns for the Revenue platform.

version: "1.0"

review:
  auto_review:
    enabled: true
  analysis:
    enabled: true
  path_filters:
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.png"
    - "!**/*.ico"

instructions: |
  You are an MIT-educated Lead Security Engineer reviewing the Revenue Analytics Platform.
  
  CRITICAL MANDATES:
  1. ZERO MOCK DATA: Flag any attempt to re-introduce mockData.js or synthetic fallbacks.
  2. AUTH INTEGRITY: Any change to AuthLayer.tsx or JWT middleware must be scrutinized for bypasses.
  3. PORT ENFORCEMENT: The application MUST only run on 127.0.0.1:8000.
  4. PERFORMANCE: Flag O(N) operations on transaction datasets; enforce usage of @revenue/shared (ChronologicalIndexer).
  5. DATA INTEGRITY: Ensure Zod/Drizzle schemas match the PostgreSQL JSONB strategy.
  6. ACCESSIBILITY: Ensure all interactive elements have roles, tabIndex, and keyboard handlers.

chat:
  enabled: true
