name: Production CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Test Execution
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Check out Repository Source Code
        uses: actions/checkout@v4

      - name: Initialize Node.js Environment (${{ matrix.node-version }})
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Clean Install NPM Dependencies
        run: npm ci

      - name: Compile and Verify TypeScript Assets
        run: npm run build

      - name: Execute Automated Regression Test Suites
        run: npm test
