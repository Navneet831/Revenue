<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/x-icon" href="/Logo.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Grew Analytics</title>
    </head>
    <body class="bg-[#0b101e] text-slate-400 overflow-hidden">
        <div id="root">
            <div id="app-boot-loader" style="position: fixed; inset: 0; background: #05070a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999999; font-family: sans-serif;">
                <div style="width: 40px; height: 40px; border: 3px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div>
                <p style="color: #94a3b8; font-size: 12px; margin-top: 20px; letter-spacing: 0.1em; text-transform: uppercase;">Establishing Matrix Connection...</p>
                <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
                <script>
                    window.onerror = function(msg, url, lineNo, columnNo, error) {
                        var div = document.createElement('div');
                        div.style.position = 'fixed';
                        div.style.bottom = '20px';
                        div.style.left = '20px';
                        div.style.right = '20px';
                        div.style.background = '#4c0505';
                        div.style.color = '#fca5a5';
                        div.style.padding = '15px';
                        div.style.borderRadius = '8px';
                        div.style.fontSize = '12px';
                        div.style.border = '1px solid #991b1b';
                        div.style.zIndex = '1000000';
                        div.innerText = 'BOOT ERROR: ' + msg + ' (' + url + ':' + lineNo + ')';
                        document.body.appendChild(div);
                        return false;
                    };
                </script>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
